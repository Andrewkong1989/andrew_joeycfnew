name: Sync from cfnew
on:
  schedule:
    # UTC 每天凌晨2点执行 → 北京时间上午10点自动同步
    - cron: '0 2 * * *'
  # 支持网页手动触发测试
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: "byJoey/cfnew" # 👉这里修改！例如 joeycf/andrew_joeycf
      TARGET_BRANCH: "main" # 如果你的主分支是master，就改成master
    permissions:
      contents: write
    steps:
      - name: Checkout current fork repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream source
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream
          git checkout ${{ env.TARGET_BRANCH }}
          git merge upstream/${{ env.TARGET_BRANCH }}
          git push origin ${{ env.TARGET_BRANCH }}
